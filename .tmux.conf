# True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Start indexing at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Increase scrollback
set -g history-limit 50000

# Faster key response
set -sg escape-time 0

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Refresh pane title(s) from cwd / foreground command
bind T run-shell -b "~/.tmux/retitle-pane.sh #{pane_id}"
bind C-t run-shell -b "~/.tmux/retitle-pane.sh --all"

# Mouse + pane splitting
set -g mouse on
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind c new-window -c "#{pane_current_path}"

# vi-style copy mode (needed for tmux-yank, tmux-jump)
setw -g mode-keys vi

# Window name (#W) stays under our control; pane title (#T) tracks what apps send
# (Cursor Agent chat titles, vim, remote shells, etc.)
set -g automatic-rename off
set -g allow-rename off
set -g set-titles on
set -g set-titles-string "#T"

# Status bar position/refresh
set-option -g status-position bottom
set -g status-interval 1
set -g status-right-length 150
set -g status-left-length 100

# ---- Plugins (all declarations must come before TPM run) ----
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Session persistence
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# Clipboard
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @override_copy_command 'xclip -selection clipboard'

# Easymotion-style jump
set -g @plugin 'schasse/tmux-jump'
bind-key j run-shell "tmux neww tmux-jump"

# Pomodoro — prefix+p toggle, P cancel, _ skip
set -g @plugin 'olimorris/tmux-pomodoro-plus'
set -g @pomodoro_granularity 'on'
set -g @pomodoro_mins 25
set -g @pomodoro_break_mins 5

# URL opener
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @fzf-url-bind 'u'

# System stats
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'

# Theme — catppuccin loaded only for palette + message/pane styles;
# the status bar itself is hand-built below (minimal, flat, one accent).
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor 'mocha'
run '~/.tmux/plugins/tmux/catppuccin.tmux'

# ---- Status bar design ----
# Palette (mocha): text #cdd6f4  subtext #a6adc8  overlay #6c7086
#                  surface0 #313244  surface1 #45475a  teal #94e2d5  red #f38ba8  peach #fab387
# Left: session name; dot turns red while prefix is held
set -g status-left "#[fg=#{?client_prefix,#f38ba8,#94e2d5}] ● #[fg=#a6adc8,bold]#S#[nobold]   "


# Right: muted info, thin dot separators; pomodoro only appears when running
set -g status-right "#[fg=#6c7086]#{b:pane_current_path}"
set -ag status-right "#{?#{pomodoro_status},#[fg=#45475a]  ·  #[fg=#fab387]#{pomodoro_status},}"
set -ag status-right "#[fg=#45475a]  ·  #[fg=#585b70]cpu #[fg=#a6adc8]#{cpu_percentage}"
set -ag status-right "#[fg=#45475a]  ·  #[fg=#585b70]mem #[fg=#a6adc8]#{ram_percentage}"
set -ag status-right "#[fg=#45475a]  ·  #[fg=#585b70]bat #[fg=#a6adc8]#{battery_percentage}"
set -ag status-right "#[fg=#45475a]  ·  #[fg=#cdd6f4,bold]%H:%M#[nobold] "

# Init TPM — must be LAST so cpu/battery/pomodoro can populate formats
run '~/.tmux/plugins/tpm/tpm'

# ---- Overrides that must come AFTER TPM (TPM re-runs catppuccin and resets these) ----
set -g status-style "bg=default,fg=#6c7086"
set -g status-justify left
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#45475a"
set -g pane-border-lines single


# Windows: dim index + title; active gets a soft block.
# SSH titles ("user@host: /long/path") are shortened to "host dir".
set -g @wt_host '#{=/14/…:#{s/^[^@]*@([a-zA-Z0-9_-]+).*$/\1/:pane_title}}'
set -g @wt_dir  "#{s/^.*[ ]//:#{b:pane_title}}"
set -g @wt_plain "#{=/24/…:pane_title}"
set -g window-status-separator "  "
set -g window-status-format " #[fg=#585b70]#I #{?#{m/r:^[^ @]+@[a-zA-Z0-9_.-]+,#{pane_title}},#[fg=#6c7086]#{E:@wt_host} #[fg=#7f849c]#{E:@wt_dir},#[fg=#6c7086]#{E:@wt_plain}}#{?window_zoomed_flag, #[fg=#fab387]⤢,} "
set -g window-status-current-format "#[bg=#313244] #[fg=#94e2d5]#I #{?#{m/r:^[^ @]+@[a-zA-Z0-9_.-]+,#{pane_title}},#[fg=#89b4fa]#{E:@wt_host} #[fg=#cdd6f4#,bold]#{E:@wt_dir},#[fg=#cdd6f4#,bold]#{E:@wt_plain}}#[nobold]#{?window_zoomed_flag, #[fg=#fab387]⤢,} #[bg=default]"
set -g window-status-activity-style "fg=#fab387"
set -g window-status-bell-style "fg=#f38ba8"
